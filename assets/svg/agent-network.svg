<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .central-node {
        animation: pulse 2s ease-in-out infinite;
      }
      .connecting-line {
        animation: dash 2s linear infinite;
      }
      @keyframes pulse {
        0% {
          fill: #38bdf8;
          filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.7));
        }
        50% {
          fill: #7dd3fc;
          filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.9));
        }
        100% {
          fill: #38bdf8;
          filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.7));
        }
      }
      @keyframes dash {
        0% { stroke-dasharray: 0, 20; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 10, 20; stroke-dashoffset: -10; }
        100% { stroke-dasharray: 0, 20; stroke-dashoffset: -20; }
      }
    </style>
  </defs>
  <!-- Central node -->
  <circle cx="50" cy="50" r="12" class="central-node"/>

  <!-- Connecting lines -->
  <line x1="50" y1="50" x2="30" y2="30" class="connecting-line" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="70" y2="30" class="connecting-line" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="50" y2="70" class="connecting-line" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Outer nodes -->
  <circle cx="30" cy="30" r="6" fill="#38bdf8" opacity="0.8"/>
  <circle cx="70" cy="30" r="6" fill="#38bdf8" opacity="0.8"/>
  <circle cx="50" cy="70" r="6" fill="#38bdf8" opacity="0.8"/>
</svg>