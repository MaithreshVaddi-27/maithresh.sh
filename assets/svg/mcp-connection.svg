<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .server-node {
        fill: #38bdf8;
        animation: pulse-server 2s ease-in-out infinite;
      }
      .client-node {
        fill: #10b981;
        animation: pulse-client 2s ease-in-out infinite 1s;
      }
      .connection-line {
        stroke: #94a3b8;
        stroke-width: 1.5;
        animation: pulse-connection 2s ease-in-out infinite;
      }
      .data-packet {
        fill: #f59e0b;
        width: 4;
        height: 4;
        animation: move-data 2s linear infinite;
      }
      @keyframes pulse-server {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; }
      }
      @keyframes pulse-client {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; }
      }
      @keyframes pulse-connection {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }
      @keyframes move-data {
        0% { transform: translate(15px, 20px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(70px, 50px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Server (left) -->
  <rect x="15" y="30" width="20" height="40" rx="4" class="server-node"/>
  <text x="25" y="20" font-size="8" text-anchor="middle" fill="#94a3b8">MCP</text>
  <text x="25" y="75" font-size="8" text-anchor="middle" fill="#94a3b8">Server</text>

  <!-- Client (right) -->
  <rect x="65" y="30" width="20" height="40" rx="4" class="client-node"/>
  <text x="75" y="20" font-size="8" text-anchor="middle" fill="#94a3b8">MCP</text>
  <text x="75" y="75" font-size="8" text-anchor="middle" fill="#94a3b8">Client</text>

  <!-- Connection line -->
  <line x1="35" y1="50" x2="65" y2="50" class="connection-line"/>

  <!-- Data packets -->
  <rect x="19" y="48" width="4" height="4" class="data-packet"/>
  <rect x="24" y="48" width="4" height="4" class="data-packet"/>
  <rect x="29" y="48" width="4" height="4" class="data-packet"/>

  <!-- Labels -->
  <text x="50" y="15" font-size="9" text-anchor="middle" fill="#64748b">Model Context Protocol</text>
  <text x="50" y="85" font-size="9" text-anchor="middle" fill="#64748b">Secure Bidirectional Communication</text>
</svg>