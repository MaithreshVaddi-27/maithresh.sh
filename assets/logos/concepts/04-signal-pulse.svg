<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="t">
  <title id="t">maithresh.sh — Signal Pulse concept</title>
  <desc>An oscilloscope trace that resolves into a bold M, with a live charge running the wire between green and amber terminals. A telemetry-first mark for a builder whose work is always live.</desc>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="sig" d="M92 348 L92 168 L172 276 L252 168 L252 348"/>
  </defs>
  <rect width="480" height="480" fill="#07090e"/>
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.7">
    <path d="M64 168 H400 M64 224 H400 M64 280 H400 M64 336 H400"/>
    <path d="M96 148 V356 M160 148 V356 M224 148 V356 M288 148 V356 M352 148 V356" stroke-opacity="0.35"/>
  </g>
  <path d="M64 140 V356 H80" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.45"/>
  <use href="#sig" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.55"/>
  <use href="#sig" fill="none" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="92" cy="168" r="10" fill="#10b981" filter="url(#glow)"/>
  <circle cx="252" cy="168" r="10" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="172" cy="276" r="6" fill="#7dd3fc"/>
  <circle r="8" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#sig"/></animateMotion>
  </circle>
  <rect x="64" y="372" width="336" height="6" rx="3" fill="#1e293b"/>
  <rect x="64" y="372" width="56" height="6" rx="3" fill="#38bdf8" opacity="0.8">
    <animate attributeName="x" values="64;344;64" dur="2.2s" repeatCount="indefinite"/>
  </rect>
</svg>
