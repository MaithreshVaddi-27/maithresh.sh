<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="t">
  <title id="t">maithresh.sh — Neon Monogram concept</title>
  <desc>A lowercase m built from two rounded neon arches, terminated by a blinking block cursor. Cyan plasma #38bdf8 with green and amber status LEDs on the #07090e substrate inside a glass tile.</desc>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="480" height="480" fill="#07090e"/>
  <rect x="40" y="40" width="400" height="400" rx="96" fill="#ffffff" fill-opacity="0.03" stroke="#1e293b" stroke-width="2"/>
  <path d="M72 108 V72 H108 M372 72 H408 V108 M408 372 V408 H372 M108 408 H72 V372" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="3" stroke-linecap="square"/>
  <g fill="none" stroke="#38bdf8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M152 344 L152 184 Q152 168 168 168 L204 168 Q220 168 220 184 L220 344"/>
    <path d="M220 344 L220 184 Q220 168 236 168 L272 168 Q288 168 288 184 L288 344"/>
  </g>
  <g fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M152 344 L152 184 Q152 168 168 168 L204 168 Q220 168 220 184 L220 344"/>
    <path d="M220 344 L220 184 Q220 168 236 168 L272 168 Q288 168 288 184 L288 344"/>
  </g>
  <circle cx="332" cy="330" r="13" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="120" r="6" fill="#10b981" filter="url(#soft)"/>
  <circle cx="360" cy="120" r="6" fill="#f59e0b" filter="url(#soft)"/>
  <rect x="152" y="372" width="180" height="8" rx="4" fill="#1e293b"/>
  <rect x="152" y="372" width="40" height="8" rx="4" fill="#38bdf8" filter="url(#soft)">
    <animate attributeName="x" values="152;292;152" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
