<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="t">
  <title id="t">maithresh.sh — Constellation concept</title>
  <desc>A network of linked nodes with a bright rising trajectory, echoing the contribution graph and open-source collaboration. A data-driven mark that is unique per build.</desc>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="traj" d="M108 348 L156 272 L228 224 L208 132"/>
  </defs>
  <rect width="480" height="480" fill="#07090e"/>
  <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.16">
    <path d="M108 348 L156 272 M108 348 L212 316 M156 272 L132 184 M156 272 L212 316 M156 272 L228 224 M132 184 L228 224 M132 184 L208 132 M212 316 L228 224 M212 316 L300 268 M228 224 L208 132 M228 224 L300 268 M228 224 L324 176 M208 132 L276 112 M208 132 L324 176 M300 268 L324 176 M300 268 L348 336 M324 176 L276 112 M212 316 L348 336"/>
  </g>
  <g fill="#38bdf8" fill-opacity="0.5">
    <circle cx="212" cy="316" r="7"/><circle cx="300" cy="268" r="7"/><circle cx="324" cy="176" r="7"/>
    <circle cx="276" cy="112" r="7"/><circle cx="348" cy="336" r="7"/><circle cx="132" cy="184" r="7"/>
  </g>
  <use href="#traj" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.5"/>
  <use href="#traj" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="156" cy="272" r="9" fill="#7dd3fc" filter="url(#glow)"/>
  <circle cx="228" cy="224" r="9" fill="#7dd3fc" filter="url(#glow)"/>
  <circle cx="108" cy="348" r="11" fill="#10b981" filter="url(#glow)"/>
  <circle cx="108" cy="348" r="20" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="208" cy="132" r="11" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="208" cy="132" r="20" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
  <circle r="6" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite"><mpath href="#traj"/></animateMotion>
  </circle>
</svg>
