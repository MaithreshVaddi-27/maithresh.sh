# Weekly contribution-snapshot refresh — the backstop for quiet periods.
#
# Every push to main already refreshes the snapshot inside the deploy pipeline
# (deploy-pages.yml regenerates before building and commits back after
# uploading), so active development never ships stale graph data. This workflow
# covers stretches with no pushes: it re-runs the refresh script and commits
# only when the data actually changed.

name: refresh contribution snapshot

on:
  schedule:
    # Monday 00:00 UTC — weekly is plenty; the live API covers intraday.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-contrib
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate contribution snapshot
        run: node scripts-refresh-contrib.mjs

      - name: Commit when the snapshot changed
        run: |
          # checkout@v4 leaves a detached HEAD, on which `git pull --rebase`
          # refuses to run — commit where we are, rebase onto the fetched tip,
          # push HEAD:main explicitly. See deploy-pages.yml for the full note.
          if git diff --quiet -- src/data/contributions.json; then
            echo "snapshot unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/contributions.json
          git commit -m "chore: refresh contribution snapshot"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
